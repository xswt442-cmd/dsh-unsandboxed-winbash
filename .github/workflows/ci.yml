name: ci

# This is a Windows plugin: it only ever mounts on win32, and the tool it adds can
# only spawn Git Bash there. Every job therefore runs on a Windows runner, which also
# ships Git for Windows — no job exists to prove anything about other platforms.
on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: unit + e2e (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          # The paired-translation gate diffs the branch against the pull request
          # base, which a shallow checkout cannot answer.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: install
        # `npm ci` from the tracked lockfile, so the job resolves exactly what the
        # developer committed, and `--ignore-scripts` keeps a dependency's install
        # hook out of the run.
        run: npm ci --ignore-scripts
      - name: docs
        run: npm run docs:check
      - name: docs pairs change together
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        # `shell: bash` is deliberate on a Windows runner: Git Bash ships there, and
        # the variable would not expand in the default PowerShell.
        shell: bash
        run: npm run docs:check -- --base "$DOCS_BASE"
      - name: unit tests (no process spawned)
        run: npm test
      - name: Git Bash is present
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\Git\usr\bin\bash.exe')) {
            throw 'Git Bash is missing on this runner; the end-to-end suite cannot be trusted'
          }
      - name: end-to-end (spawns Git Bash)
        run: npm run test:e2e

  boot:
    name: host loads the bundle (dsh ${{ matrix.dsh-spec }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # A range that excludes a host generation is not caught by `npm test`: it
        # shows up as the plugin loading a stale copy of the harness pieces, so the
        # host line named here is the line the ranges must cover. `@0.1.5-rc.1` is
        # not usable as an anchor: that host's profile asks for
        # `@deepseek-ai/dsh-sandbox-local`, which no longer installs, so its boot
        # fails before this repository's bundle is read.
        dsh-spec: ['@0.1.5-rc.3', '@0.2.0-rc.1']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: install
        # The profile below points at this checkout, so the host resolves the
        # plugin's own dependencies from here: this is the step that proves the
        # declared ranges install the generation the host is running.
        run: npm ci --ignore-scripts
      - name: install DSH
        run: npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"
      - name: report the host version under test
        shell: pwsh
        run: |
          $root = (& npm root -g).Trim()
          $manifest = Join-Path $root '@deepseek-ai\dsh\package.json'
          if (-not (Test-Path $manifest)) { throw "no dsh manifest at $manifest" }
          $v = (Get-Content $manifest -Raw | ConvertFrom-Json).version
          Write-Host "dsh host under test: $v (${{ matrix.dsh-spec }})"
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "unreadable dsh version: $v" }
      - name: register the bundle in a temporary profile
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:DSH_HOME\profiles\web\node_modules" | Out-Null
          New-Item -ItemType Junction -Path "$env:DSH_HOME\profiles\web\node_modules\dsh-unsandboxed-winbash" -Target (Get-Location).Path | Out-Null
          $profileJson = @'
          {
            "name": "dsh-profile-web",
            "private": true,
            "dependencies": {},
            "dsh": { "profile": { "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-unsandboxed-winbash"] } }
          }
          '@ | ConvertFrom-Json | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText("$env:DSH_HOME\profiles\web\package.json", $profileJson, (New-Object System.Text.UTF8Encoding($false)))
      - name: boot the host and reach the shell
        shell: pwsh
        env:
          DSH_HOME: ${{ runner.temp }}\dshhome
        run: |
          $ErrorActionPreference = 'Stop'
          $globalRoot = (& npm root -g).Trim()
          $dshBin = Join-Path $globalRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "dsh bin not found at $dshBin" }
          $outFile = Join-Path $env:RUNNER_TEMP 'dsh-web-out.log'
          $errFile = Join-Path $env:RUNNER_TEMP 'dsh-web-err.log'
          # The host announces its URL with a launch token in it, and that token
          # is a credential for the runner's web server while the process lives, so
          # a failure path echoes the log with those lines replaced instead of the
          # raw file. The lines the auth step needs are read unredacted and never
          # printed.
          function Show-DshLog([string]$path) {
            if (-not (Test-Path $path)) { return "<no log at $path>" }
            ((Get-Content $path) | ForEach-Object {
              if ($_ -match '[?&]token=' -or $_ -match '(?i)launch[\s_-]?token') { '<line redacted: carried a launch token>' } else { $_ }
            }) -join "`n"
          }
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList "`"$dshBin`"", 'web', '--port', '3131', '--no-open' -WindowStyle Hidden -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          try {
            # Ready means the port answers, not that it answers 200: some builds
            # gate the shell behind the launch token and answer 401 until it is
            # redeemed, and a bundle that throws while mounting takes the boot down
            # with it — which is what this job is for.
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $null = Invoke-WebRequest -Uri 'http://127.0.0.1:3131/' -UseBasicParsing -TimeoutSec 3
                $ready = $true; break
              } catch {
                if ($_.Exception.Response) { $ready = $true; break }
              }
              if ($process.HasExited) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw "dsh web did not become ready with the bundle registered`nstdout:`n$(Show-DshLog $outFile)`nstderr:`n$(Show-DshLog $errFile)`n" }

            $tokenPattern = [regex]'[?&]token=([^&\s]+)'
            $session = $null
            $shell = $null
            for ($i = 0; $i -lt 15 -and -not $shell; $i++) {
              $log = [string](Get-Content $outFile -Raw -ErrorAction SilentlyContinue)
              $token = $tokenPattern.Match($log)
              $url = if ($token.Success) { "http://127.0.0.1:3131/?token=$($token.Groups[1].Value)" } else { 'http://127.0.0.1:3131/' }
              try {
                $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 5 -SessionVariable session
                if ($response.StatusCode -eq 200) { $shell = $response }
              } catch {}
              if (-not $shell) { Start-Sleep -Seconds 1 }
            }
            if (-not $shell) { throw "the web shell never answered 200`nstdout:`n$(Show-DshLog $outFile)`nstderr:`n$(Show-DshLog $errFile)`n" }
            $stderr = if (Test-Path $errFile) { [string](Get-Content $errFile -Raw) } else { '' }
            if ($stderr.Trim()) { throw "the host wrote to stderr with the bundle registered:`n$stderr" }
            Write-Host "host booted and served the shell with dsh-unsandboxed-winbash registered"
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  package:
    name: package contents
    # Packing is platform-neutral, but this is a Windows plugin, so the package check
    # runs where the plugin runs rather than on a platform the plugin never loads on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: install
        run: npm ci --ignore-scripts
      - name: the published tarball carries the bundle patch and both READMEs
        shell: bash
        run: |
          set -euo pipefail
          # Matched against npm's own listing rather than --json output: the JSON shape
          # differs between npm majors (array in some, object keyed by package in
          # others), and a shape assumption here would fail the job for no real reason.
          # `shell: bash` is deliberate on a Windows runner: Git Bash ships there.
          listing=$(npm pack --dry-run 2>&1)
          for required in cordis.patch.yml lib/index.js lib/tool/exec.js README.md README.en.md docs/CHANGELOG.md docs/CHANGELOG.en.md LICENSE; do
            if ! grep -qF "$required" <<<"$listing"; then
              echo "::error::missing from the tarball: $required"
              exit 1
            fi
          done
          echo "tarball carries every required file"
