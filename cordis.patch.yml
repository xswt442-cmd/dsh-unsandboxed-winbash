# dsh-unsandboxed-winbash bundle patch: one loader row mounts the Git Bash tool.
#
# The tool id is "winbash" because that is what the tool is called in a transcript
# and in a session's system prompt; renaming it would invalidate every prompt and
# transcript that refers to it. The PACKAGE is named after the property that matters
# here: it runs outside the file sandbox.
- insert:
    - id: tool-winbash
      name: dsh-unsandboxed-winbash/tool
      config:
        gitPathPrefix: true
